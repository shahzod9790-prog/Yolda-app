<script>
// ---------------- Avtomatik yangilanish ----------------

    setTimeout(function () { var o = D.getElementById("yolda-upd"); if (o && o.parentNode) o.parentNode.removeChild(o); openApp(); }, 8000);

    history: (eventRows || []).map(rowToEvent),
    sends: (sendRows || []).map((r) => ({ id: r.id, batchNumber: r.batch_number, sentAt: new Date(r.sent_at).getTime() })),
  };
}
// Har bir jo'natishni alohida "partiya" sifatida matn ko'rinishida tayyorlaydi (nusxalash uchun)
const BATCH_FIELDS = {
  zagruzka: ["address", "km", "distance"],
  zapravka: ["km", "distance", "tractorLiters", "trailerLiters", "adBlue"],
  vigruzka: ["address", "km", "distance", "motoChas", "motoChasWorked"],
};
function formatFieldValue(f, v) {
  if (f === "loadStatus") return LOAD_LABELS[v] || v;
  if (f === "km" || f === "distance" || f === "newKm") return `${fmt(v)} km`;
  if (f === "motoChas" || f === "motoChasWorked") return `${fmt(v)} soat`;
  if (f.toLowerCase().includes("liters") || f === "adBlue") return `${fmt(v)} l`;
  return v;
}
function buildBatchText(trip, driverLabel, events) {
  const lines = [`YO'LDA — yuborilgan ma'lumotlar`, `Haydovchi: ${driverLabel}`, `Tyagach: ${trip.tractorNumber || ""}   Prisep: ${trip.trailerNumber || "YO'Q"}`, ""];
  events.forEach((ev) => {
    const label = ev.type === "zagruzka" ? "ZAGRUZKA" : ev.type === "zapravka" ? "ZAPRAVKA" : ev.type === "vigruzka" ? "VIGRUZKA" : (CHANGE_LABELS[ev.type] || ev.type);
    lines.push(`[${label}] ${fmtDate(ev.at)}`);
    const fields = BATCH_FIELDS[ev.type] || ["address", "km", "newKm", "motoChas", "loadStatus", "newTractorNumber", "newTrailerNumber"];
    fields.forEach((f) => { if (ev[f] !== undefined && ev[f] !== null && ev[f] !== "") lines.push(`  ${FIELD_LABELS[f]}: ${formatFieldValue(f, ev[f])}`); });
    lines.push("");
  });
  return lines.join("\n");
}

// ==================== APP ====================
function App() {
  const [local, setLocal] = useState(null);
  const [trip, setTrip] = useState(null);
  const [tab, setTab] = useState("main");
  const [modal, setModal] = useState(null);
  const [loading, setLoading] = useState(true);
  const [errorMsg, setErrorMsg] = useState(null);
  const busyRef = useRef(false); // guards against double-submit (double-tap) writing the same event twice

  useEffect(() => {
    (async () => {
      const l = loadLocal();
      setLocal(l);
      if (l.activeTripId) { const t = await fetchTripFull(l.activeTripId); setTrip(t); }
      setLoading(false);
    })();
  }, []);

  function persistLocal(next) { setLocal(next); saveLocal(next); }
  async function refreshTrip() {
    if (!local?.activeTripId) return;
    const t = await fetchTripFull(local.activeTripId);
    if (t) setTrip(t); else setErrorMsg("Ma'lumotni yangilab bo'lmadi. Internet aloqasini tekshirib, sahifani yangilang."); // xatoda mavjud reys ekrandan yo'qolmasin
  }

  async function saveDriver(driver) {
    setErrorMsg(null);
    const { data: drv } = await sb.from("drivers").select("id").eq("first_name", driver.firstName).eq("last_name", driver.lastName).maybeSingle();
    if (drv) {
      const { data: openTrip } = await sb.from("trips").select("id").eq("driver_id", drv.id).eq("completed", false).order("started_at", { ascending: false }).limit(1).maybeSingle();
      if (openTrip) {
        const t = await fetchTripFull(openTrip.id);
        persistLocal({ driver, activeTripId: openTrip.id });
        setTrip(t); setTab("main");
        return;
      }
    }
    persistLocal({ driver, activeTripId: null });
  }

  async function startTrip(data) {
    if (busyRef.current) return;
    busyRef.current = true;
    setErrorMsg(null);
    try {
      const { data: tripId, error } = await sb.rpc("start_trip", {
        p_driver_first: local.driver.firstName, p_driver_last: local.driver.lastName,
        p_tractor_number: data.tractorNumber, p_trailer_number: data.trailerNumber,
        p_start_km: num(data.startKm), p_start_moto_chas: num(data.motoChas), p_moto_chas_photo: data.motoChasPhoto,
      });
      if (error) throw error;
      const t = await fetchTripFull(tripId);
      persistLocal({ ...local, activeTripId: tripId });
      setTrip(t); setModal(null); setTab("main");
    } catch (err) {
      setErrorMsg(err.message?.includes("TRACTOR_BUSY") ? "Bu tyagach hozir boshqa reysda band." : err.message?.includes("TRAILER_BUSY") ? "Bu prisep hozir boshqa reysda band." : "Xatolik: " + err.message);
    } finally {
      busyRef.current = false;
    }
  }

  async function addEvent(type, data) {
    if (busyRef.current) return;
    busyRef.current = true;
    try {
      // Yengil yangilash: faqat yangi yozuv qaytadi (eski rasmlar qayta yuklanmaydi)
      const { data: row, error } = await sb.from("trip_events").insert({ trip_id: trip.id, type, data }).select("id,type,at,batch_id").single();
      if (error) { setErrorMsg("Saqlashda xatolik: " + error.message); return; }
      const ev = rowToEvent({ ...row, data });
      setTrip((prev) => prev ? { ...prev, history: [...prev.history.filter((e) => e.id !== ev.id), ev].sort((a, b) => a.at - b.at) } : prev);
      setModal(null);
    } finally {
      busyRef.current = false;
    }
  }

  async function tractorFinish(data) {
    if (busyRef.current) return;
    busyRef.current = true;
    try {
      const { error } = await sb.rpc("finish_tractor", { p_trip_id: trip.id, p_km: num(data.km), p_address: data.address });
      if (error) { setErrorMsg(error.message); return; }
      await refreshTrip(); setModal(null); // avval yangi holat yuklanadi, keyin oyna yopiladi (eski holat ko'rinib qolmasligi uchun)
    } finally {
      busyRef.current = false;
    }
  }
  async function tractorAccept(data) {
    if (busyRef.current) return;
    busyRef.current = true;
    try {
      const { error } = await sb.rpc("accept_tractor", { p_trip_id: trip.id, p_new_tractor_number: data.newTractorNumber, p_new_km: num(data.newKm), p_address: data.address });
      if (error) throw error;
      await refreshTrip();
    } catch (err) { setErrorMsg(err.message?.includes("TRACTOR_BUSY") ? "Bu tyagach hozir band." : err.message); }
    finally { busyRef.current = false; }
  }
  async function tractorConfirm() {
    if (busyRef.current) return;
    const pend = derivePending(trip.history).pendingTractor;
    if (!pend.accept) return;
    busyRef.current = true;
    try {
      const { error } = await sb.rpc("confirm_tractor", { p_trip_id: trip.id, p_new_tractor_number: pend.accept.newTractorNumber, p_new_km: pend.accept.newKm });
      if (error) { setErrorMsg(error.message); return; }
      await refreshTrip(); setModal(null); // avval yangi holat yuklanadi, keyin oyna yopiladi (eski holat ko'rinib qolmasligi uchun)
    } finally {
      busyRef.current = false;
    }
  }
  async function trailerFinish(data) {
    if (busyRef.current) return;
    busyRef.current = true;
    try {
      const { error } = await sb.rpc("finish_trailer", { p_trip_id: trip.id, p_km: num(data.km), p_address: data.address, p_moto_chas: num(data.motoChas), p_moto_chas_photo: data.motoChasPhoto, p_load_status: data.loadStatus, p_photos: data.photos });
      if (error) { setErrorMsg(error.message); return; }
      await refreshTrip(); setModal(null); // avval yangi holat yuklanadi, keyin oyna yopiladi (eski holat ko'rinib qolmasligi uchun)
    } finally {
      busyRef.current = false;
    }
  }
  async function trailerAccept(data) {
    if (busyRef.current) return;
    busyRef.current = true;
    try {
      const { error } = await sb.rpc("accept_trailer", { p_trip_id: trip.id, p_new_trailer_number: data.newTrailerNumber, p_new_km: num(data.newKm), p_address: data.address, p_moto_chas: num(data.motoChas), p_moto_chas_photo: data.motoChasPhoto, p_load_status: data.loadStatus, p_photos: data.photos });
      if (error) throw error;
      await refreshTrip();
    } catch (err) { setErrorMsg(err.message?.includes("TRAILER_BUSY") ? "Bu prisep hozir band." : err.message); }
    finally { busyRef.current = false; }
  }
  async function trailerConfirm() {
    if (busyRef.current) return;
    const pend = derivePending(trip.history).pendingTrailer;
    if (!pend.accept) return;
    busyRef.current = true;
    try {
      const { error } = await sb.rpc("confirm_trailer", { p_trip_id: trip.id, p_new_trailer_number: pend.accept.newTrailerNumber, p_moto_chas: pend.accept.motoChas });
      if (error) { setErrorMsg(error.message); return; }
      await refreshTrip(); setModal(null); // avval yangi holat yuklanadi, keyin oyna yopiladi (eski holat ko'rinib qolmasligi uchun)
    } finally {
      busyRef.current = false;
    }
  }

  async function updateEvent(id, patch) {
    if (busyRef.current) return;
    busyRef.current = true;
    try {
      const ev = trip.history.find((e) => e.id === id);
      const { error } = await sb.from("trip_events").update({ data: { ...eventRawData(ev), ...patch } }).eq("id", id);
      if (error) { setErrorMsg(error.message); return; }
      setTrip((prev) => prev ? { ...prev, history: prev.history.map((e) => (e.id === id ? { ...e, ...patch } : e)) } : prev);
    } finally {
      busyRef.current = false;
    }
  }
  async function sendAllFiles() {
    if (busyRef.current) return;
    busyRef.current = true;
    try {
      const { data: pendingRows, error: e0 } = await sb.from("trip_events").select("id").eq("trip_id", trip.id).is("batch_id", null);
      if (e0) { setErrorMsg(e0.message); return; }
      if (!pendingRows || pendingRows.length === 0) return;
      const { data: lastBatch } = await sb.from("trip_sends").select("batch_number").eq("trip_id", trip.id).order("batch_number", { ascending: false }).limit(1);
      const nextNumber = (lastBatch && lastBatch[0] ? lastBatch[0].batch_number : 0) + 1;
      const { data: newBatch, error: e1 } = await sb.from("trip_sends").insert({ trip_id: trip.id, batch_number: nextNumber }).select().single();
      if (e1) { setErrorMsg(e1.message); return; }
      const { error: e2 } = await sb.from("trip_events").update({ batch_id: newBatch.id }).in("id", pendingRows.map((r) => r.id));
      if (e2) { setErrorMsg(e2.message); return; }
      const sentIds = new Set(pendingRows.map((r) => r.id));
      const newSend = { id: newBatch.id, batchNumber: newBatch.batch_number, sentAt: new Date(newBatch.sent_at).getTime() };
      setTrip((prev) => prev ? { ...prev, history: prev.history.map((e) => (sentIds.has(e.id) ? { ...e, batchId: newBatch.id } : e)), sends: [...prev.sends, newSend] } : prev);
    } finally {
      busyRef.current = false;
    }
  }
  async function resetTrip() {
    await sb.rpc("end_trip", { p_trip_id: trip.id });
    persistLocal({ ...local, activeTripId: null });
    setTrip(null); setModal(null); setTab("main");
  }

  if (loading) {
    return <div className="app-shell" style={{ background: COLORS.bg, display: "flex", alignItems: "center", justifyContent: "center", color: COLORS.muted, fontFamily: "Inter" }}><style>{FONT_IMPORT}</style>yuklanmoqda...</div>;
  }

  const viewTrip = trip ? { ...trip, ...deriveTrip(trip), ...derivePending(trip.history) } : null;

  return (
    <div className="app-shell" style={{ background: COLORS.bg, fontFamily: "Inter", color: COLORS.text, paddingBottom: trip ? "calc(84px + env(safe-area-inset-bottom, 0px))" : undefined }}>
      <style>{FONT_IMPORT}</style>
      <div style={{ padding: "20px 18px 14px", borderBottom: `1px solid ${COLORS.border}` }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ width: 34, height: 34, borderRadius: 8, background: COLORS.amber, display: "flex", alignItems: "center", justifyContent: "center" }}><Truck size={19} color="#1A1300" /></div>
          <div><div style={{ fontFamily: "Oswald", fontWeight: 700, fontSize: 19, letterSpacing: 0.5 }}>YO'LDA</div><div style={{ fontSize: 11, color: COLORS.muted, marginTop: -2 }}>reys va yoqilg'i nazorati</div></div>
        </div>
      </div>

      {errorMsg && (
        <div style={{ background: COLORS.red + "22", border: `1px solid ${COLORS.red}55`, color: COLORS.red, padding: "10px 14px", margin: "12px 16px 0", borderRadius: 8, fontSize: 12.5, display: "flex", justifyContent: "space-between", gap: 10, maxWidth: 480, marginLeft: "auto", marginRight: "auto" }}>
          <span>{errorMsg}</span>
          <button onClick={() => setErrorMsg(null)} style={{ background: "transparent", border: "none", color: COLORS.red, cursor: "pointer", flexShrink: 0 }}><X size={14} /></button>
        </div>
      )}

      <div style={{ maxWidth: 480, margin: "0 auto", padding: "16px 16px 0" }}>
        {!local.driver ? <ProfileSetup onSave={saveDriver} />
          : !trip ? <StartTripForm driver={local.driver} onStart={startTrip} />
          : tab === "main" ? <MainScreen trip={viewTrip} onOpen={setModal} />
          : tab === "files" ? <FilesTab trip={viewTrip} driverLabel={`${local.driver.firstName} ${local.driver.lastName}`} onUpdateEvent={updateEvent} onSendAll={sendAllFiles} />
          : <ProfilTab driver={local.driver} trip={viewTrip} onReset={resetTrip} />}
      </div>

      {modal === "zagruzka" && viewTrip.trailerNumber && <ZagruzkaModal trip={viewTrip} onClose={() => setModal(null)} onSubmit={(d) => addEvent("zagruzka", d)} />}
      {modal === "zapravka" && <ZapravkaModal trip={viewTrip} onClose={() => setModal(null)} onSubmit={(d) => addEvent("zapravka", d)} />}
      {modal === "vigruzka" && viewTrip.trailerNumber && <VigruzkaModal trip={viewTrip} onClose={() => setModal(null)} onSubmit={(d) => addEvent("vigruzka", d)} />}
      {modal === "zamenit" && (
        <ZamenitModal trip={viewTrip} onClose={() => setModal(null)} tractorFinish={tractorFinish} tractorAccept={tractorAccept} tractorConfirm={tractorConfirm} trailerFinish={trailerFinish} trailerAccept={trailerAccept} trailerConfirm={trailerConfirm} />
      )}

      {trip && (
        <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: COLORS.panel, borderTop: `1px solid ${COLORS.border}`, display: "flex", padding: "8px 10px calc(8px + env(safe-area-inset-bottom))", gap: 6 }}>
          <TabBtn label="Asosiy" icon={Gauge} active={tab === "main"} onClick={() => setTab("main")} />
          <TabBtn label="Fayllar" icon={HistoryIcon} active={tab === "files"} onClick={() => setTab("files")} />
          <TabBtn label="Profil" icon={User} active={tab === "profil"} onClick={() => setTab("profil")} />
        </div>
      )}
    </div>
  );
}

function ZapravkaModal({ trip, onClose, onSubmit }) {
  const hasTrailer = !!trip.trailerNumber;
  const [km, setKm] = useState(""); const [tractorLiters, setTractorLiters] = useState(""); const [tractorDieselPhotos, setTractorDieselPhotos] = useState([]);

// ---------------- Fayllar ----------------
const CHANGE_LABELS = { tractor_end: "Tyagach yakunlandi", tractor_accepted: "Yangi tyagach qabul qilindi", tractor_confirmed: "Tyagach almashinuvi tasdiqlandi", trailer_end: "Prisep yakunlandi", trailer_accepted: "Yangi prisep qabul qilindi", trailer_confirmed: "Prisep almashinuvi tasdiqlandi" };
const EDITABLE_TYPES = ["zagruzka", "zapravka", "vigruzka"];
function batchEventsFor(history, batchId) {
  return history.filter((e) => e.batchId === batchId).sort((a, b) => a.at - b.at);
}
function FilesTab({ trip, driverLabel, onUpdateEvent, onSendAll }) {
  const [subTab, setSubTab] = useState("active"); const [openId, setOpenId] = useState(null); const [editingEvent, setEditingEvent] = useState(null); const [sendStep, setSendStep] = useState(null); const [copiedId, setCopiedId] = useState(null);
  const pendingHistory = trip.history.filter((e) => !e.batchId);
  const pendingFiles = computeFiles(pendingHistory);
  const pendingChanges = pendingHistory.filter((e) => e.type in CHANGE_LABELS);
  const hasPending = pendingHistory.length > 0;

  function renderFileEvents(f, editable) {
    return (<>
      {f.zagruzkas.map((z) => <EventDetail key={z.id} label="ZAGRUZKA" ev={z} fields={["address", "km", "distance"]} editable={editable} onEdit={() => setEditingEvent(z)} />)}
      {f.zapravkas.map((z) => <EventDetail key={z.id} label="ZAPRAVKA" ev={z} fields={["km", "distance", "tractorLiters", "trailerLiters", "adBlue"]} editable={editable} onEdit={() => setEditingEvent(z)} />)}
      {f.vigruzkas.map((z) => <EventDetail key={z.id} label="VIGRUZKA" ev={z} fields={["address", "km", "distance", "motoChas", "motoChasWorked"]} editable={editable} onEdit={() => setEditingEvent(z)} />)}
    </>);
  }

  async function copyBatch(batch, events) {
    const text = buildBatchText(trip, driverLabel, events);
    try { await navigator.clipboard.writeText(text); setCopiedId(batch.id); setTimeout(() => setCopiedId(null), 1500); } catch {}
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <div style={{ display: "flex", gap: 8 }}><SegmentedChoice options={[{ id: "active", label: "Faol" }, { id: "archive", label: "🔒 Jo'natilgan" }]} value={subTab} onChange={setSubTab} /></div>

      {subTab === "active" && (
        <>
          {pendingFiles.length === 0 && pendingChanges.length === 0 && <Panel style={{ textAlign: "center", padding: "30px 20px", color: COLORS.muted, fontSize: 13 }}>Hali yuborilmagan fayl yo'q</Panel>}
          {pendingFiles.map((f) => {
            const key = `p-${f.dayKey}`; const isOpen = openId === key;
            return (
              <Panel key={key} style={{ padding: 0, overflow: "hidden" }}>
                <button onClick={() => setOpenId(isOpen ? null : key)} style={{ width: "100%", background: "transparent", border: "none", padding: 16, display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer", color: COLORS.text }}>
                  <div style={{ textAlign: "left" }}><div style={{ fontFamily: "Oswald", fontSize: 14.5, fontWeight: 600 }}>FAYL — {f.dayLabel}</div><div style={{ fontSize: 11, color: COLORS.muted, marginTop: 2 }}>{[f.zagruzkas.length > 0 && `Zagruzka ×${f.zagruzkas.length}`, f.zapravkas.length > 0 && `Zapravka ×${f.zapravkas.length}`, f.vigruzkas.length > 0 && `Vigruzka ×${f.vigruzkas.length}`].filter(Boolean).join(" · ")}</div></div>
                  {isOpen ? <ChevronLeft size={16} color={COLORS.muted} /> : <ChevronRight size={16} color={COLORS.muted} />}
                </button>
                {isOpen && <div style={{ padding: "0 16px 16px", borderTop: `1px solid ${COLORS.border}`, paddingTop: 14, display: "flex", flexDirection: "column", gap: 14 }}>{renderFileEvents(f, true)}</div>}
              </Panel>
            );
          })}
          {pendingChanges.length > 0 && (<><div style={{ fontFamily: "Oswald", fontSize: 15, fontWeight: 600, marginTop: 6 }}>Transport almashinuvlari</div>{pendingChanges.map((ev) => <EventDetail key={ev.id} label={CHANGE_LABELS[ev.type]} ev={ev} fields={["address", "km", "newKm", "motoChas", "loadStatus", "newTractorNumber", "newTrailerNumber"]} standalonePanel />)}</>)}
          <Btn full variant="danger" disabled={!hasPending} onClick={() => setSendStep("confirm")} icon={Check}>BARCHA FAYLLARNI JO'NATISH</Btn>
        </>
      )}

      {subTab === "archive" && (
        <>
          {trip.sends.length === 0 && <Panel style={{ textAlign: "center", padding: "30px 20px", color: COLORS.muted, fontSize: 13 }}>Hali jo'natilgan fayl yo'q</Panel>}
          {[...trip.sends].reverse().map((batch) => {
            const events = batchEventsFor(trip.history, batch.id);
            if (events.length === 0) return null;
            const fromAt = events[0].at, toAt = events[events.length - 1].at;
            const key = `b-${batch.id}`; const isOpen = openId === key;
            return (
              <Panel key={key} style={{ padding: 0, overflow: "hidden" }}>
                <button onClick={() => setOpenId(isOpen ? null : key)} style={{ width: "100%", background: "transparent", border: "none", padding: 16, display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer", color: COLORS.text }}>
                  <div style={{ textAlign: "left" }}>
                    <div style={{ fontFamily: "Oswald", fontSize: 14.5, fontWeight: 600 }}>🔒 {batch.batchNumber}-jo'natish</div>
                    <div style={{ fontSize: 11, color: COLORS.muted, marginTop: 2 }}>Boshlang'ich: {fmtDate(fromAt)}</div>
                    <div style={{ fontSize: 11, color: COLORS.muted }}>Tugash: {fmtDate(toAt)}</div>
                  </div>
                  {isOpen ? <ChevronLeft size={16} color={COLORS.muted} /> : <ChevronRight size={16} color={COLORS.muted} />}
                </button>
                {isOpen && (
                  <div style={{ padding: "0 16px 16px", borderTop: `1px solid ${COLORS.border}`, paddingTop: 14, display: "flex", flexDirection: "column", gap: 14 }}>
                    <Btn variant="ghost" onClick={() => copyBatch(batch, events)}>{copiedId === batch.id ? "Nusxalandi ✓" : "Nusxalash"}</Btn>
                    {events.map((ev) => <EventDetail key={ev.id} label={ev.type === "zagruzka" ? "ZAGRUZKA" : ev.type === "zapravka" ? "ZAPRAVKA" : ev.type === "vigruzka" ? "VIGRUZKA" : (CHANGE_LABELS[ev.type] || ev.type)} ev={ev} fields={ev.type === "zagruzka" ? ["address", "km", "distance"] : ev.type === "zapravka" ? ["km", "distance", "tractorLiters", "trailerLiters", "adBlue"] : ev.type === "vigruzka" ? ["address", "km", "distance", "motoChas", "motoChasWorked"] : ["address", "km", "newKm", "motoChas", "loadStatus", "newTractorNumber", "newTrailerNumber"]} />)}
                  </div>
                )}
              </Panel>
            );
          })}
        </>
      )}

      {editingEvent && <EditEventModal ev={editingEvent} hasTrailer={!!trip.trailerNumber} onClose={() => setEditingEvent(null)} onSave={(patch) => { onUpdateEvent(editingEvent.id, patch); setEditingEvent(null); }} />}
      {sendStep === "confirm" && <SendConfirmModal onCancel={() => setSendStep(null)} onConfirm={() => setSendStep("countdown")} />}
      {sendStep === "countdown" && <SendCountdownModal onCancel={() => setSendStep(null)} onDone={() => { onSendAll(); setSendStep(null); setSubTab("archive"); }} />}
    </div>
  );
}
function SendConfirmModal({ onCancel, onConfirm }) {
  return (
    <ModalShell title="Diqqat!" onClose={onCancel}>
      <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        <div style={{ display: "flex", gap: 10, alignItems: "flex-start", background: COLORS.red + "18", borderRadius: 8, padding: 12 }}><AlertTriangle size={18} color={COLORS.red} style={{ flexShrink: 0, marginTop: 1 }} /><div style={{ fontSize: 12.5, color: COLORS.text, lineHeight: 1.6 }}>Barcha fayllarni jo'natganingizdan keyin ular tahrirlash uchun yopiladi.<br />10 soniyadan keyin fayllar avtomatik qulflanadi.<br />Qulflangandan keyin ma'lumotlarni o'zgartirib bo'lmaydi.</div></div>
        <div style={{ display: "flex", gap: 10 }}><Btn variant="ghost" full onClick={onCancel}>Bekor qilish</Btn><Btn variant="danger" full onClick={onConfirm}>Jo'natishni tasdiqlash</Btn></div>
      </div>
    </ModalShell>
  );
}
function SendCountdownModal({ onCancel, onDone }) {
  const [count, setCount] = useState(10);
  useEffect(() => { if (count <= 0) { onDone(); return; } const t = setTimeout(() => setCount((c) => c - 1), 1000); return () => clearTimeout(t); }, [count]);
  return (
    <ModalShell title="Fayllar yuborilmoqda" onClose={onCancel}>
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 18, padding: "10px 0 4px" }}>
        <div style={{ fontFamily: "'Roboto Mono', monospace", fontWeight: 700, fontSize: 52, color: COLORS.amber, textShadow: `0 0 20px ${COLORS.amber}55` }}>{count}</div>
        <div style={{ fontSize: 12.5, color: COLORS.muted, textAlign: "center" }}>Shu vaqt ichida bekor qilishingiz mumkin</div>
        <Btn variant="ghost" full onClick={onCancel}>Bekor qilish</Btn>
      </div>
    </ModalShell>
  );
}
function EditEventModal({ ev, hasTrailer, onClose, onSave }) {
  if (ev.type === "zagruzka") return <EditZagruzka ev={ev} onClose={onClose} onSave={onSave} />;
  if (ev.type === "zapravka") return <EditZapravka ev={ev} hasTrailer={hasTrailer} onClose={onClose} onSave={onSave} />;
  if (ev.type === "vigruzka") return <EditVigruzka ev={ev} onClose={onClose} onSave={onSave} />;
  return null;
}
function EditZagruzka({ ev, onClose, onSave }) {
  const [km, setKm] = useState(String(ev.km ?? "")); const [address, setAddress] = useState(ev.address || ""); const [photos, setPhotos] = useState(ev.photos || []);
  const valid = km !== "" && address && photos.length > 0;
  return (<ModalShell title="Zagruzkani tahrirlash" onClose={onClose}><div style={{ display: "flex", flexDirection: "column", gap: 14 }}><Field label="Km" value={km} onChange={setKm} suffix="km" /><AddressPicker value={address} onChange={setAddress} /><MultiPhotoPicker label="Yuk hujjatlari fotosi" photos={photos} onChange={setPhotos} required allowComment /><Btn full disabled={!valid} onClick={() => onSave({ km: num(km), address, photos })} icon={Check}>Saqlash</Btn></div></ModalShell>);
}
function EditZapravka({ ev, hasTrailer, onClose, onSave }) {
  // Prisepsiz holatda prisep salyarkasi/cheki maydonlari ko'rsatilmaydi (agar yozuvda avvaldan prisep ma'lumoti bo'lmasa)
  const showTrailer = hasTrailer || !!ev.trailerLiters || (ev.trailerDieselPhotos || []).length > 0;
  const [km, setKm] = useState(String(ev.km ?? "")); const [tractorLiters, setTractorLiters] = useState(ev.tractorLiters ? String(ev.tractorLiters) : ""); const [tractorDieselPhotos, setTractorDieselPhotos] = useState(ev.tractorDieselPhotos || []);
  const [trailerLiters, setTrailerLiters] = useState(ev.trailerLiters ? String(ev.trailerLiters) : ""); const [trailerDieselPhotos, setTrailerDieselPhotos] = useState(ev.trailerDieselPhotos || []);
  const [adBlue, setAdBlue] = useState(ev.adBlue ? String(ev.adBlue) : ""); const [adBluePhotos, setAdBluePhotos] = useState(ev.adBluePhotos || []);
  const hasTractorDiesel = tractorLiters !== ""; const hasTrailerDiesel = showTrailer && trailerLiters !== ""; const hasAdBlue = adBlue !== "";
  const valid = km !== "" && (hasTractorDiesel || hasTrailerDiesel || hasAdBlue) && (!hasTractorDiesel || tractorDieselPhotos.length > 0) && (!hasTrailerDiesel || trailerDieselPhotos.length > 0) && (!hasAdBlue || adBluePhotos.length > 0);
  return (
    <ModalShell title="Zapravkani tahrirlash" onClose={onClose}>
      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        <Field label="Km" value={km} onChange={setKm} suffix="km" />
        <SectionLabel>TYAGACH SALYARKASI</SectionLabel><Field label="Tyagachga quyilgan diesel" value={tractorLiters} onChange={setTractorLiters} suffix="litr" /><MultiPhotoPicker label="Tyagach cheki" photos={tractorDieselPhotos} onChange={setTractorDieselPhotos} required={hasTractorDiesel} allowComment />
        {showTrailer && (<><SectionLabel>PRISEP SALYARKASI</SectionLabel><Field label="Prisepga (refga) quyilgan diesel" value={trailerLiters} onChange={setTrailerLiters} suffix="litr" /><MultiPhotoPicker label="Prisep cheki" photos={trailerDieselPhotos} onChange={setTrailerDieselPhotos} required={hasTrailerDiesel} allowComment /></>)}
        <SectionLabel>ADBLUE</SectionLabel><Field label="AdBlue" value={adBlue} onChange={setAdBlue} suffix="litr" /><MultiPhotoPicker label="AdBlue cheki" photos={adBluePhotos} onChange={setAdBluePhotos} required={hasAdBlue} allowComment />
        <Btn full disabled={!valid} onClick={() => onSave({ km: num(km), tractorLiters, tractorDieselPhotos, trailerLiters: showTrailer ? trailerLiters : (ev.trailerLiters ?? ""), trailerDieselPhotos: showTrailer ? trailerDieselPhotos : (ev.trailerDieselPhotos || []), adBlue, adBluePhotos })} icon={Check}>Saqlash</Btn>
      </div>
    </ModalShell>
  );
}
function EditVigruzka({ ev, onClose, onSave }) {
  const [km, setKm] = useState(String(ev.km ?? "")); const [address, setAddress] = useState(ev.address || ""); const [motoChas, setMotoChas] = useState(String(ev.motoChas ?? "")); const [motoChasPhoto, setMotoChasPhoto] = useState(ev.motoChasPhoto || null); const [photos, setPhotos] = useState(ev.photos || []);
  const valid = km !== "" && address && motoChas !== "" && motoChasPhoto && photos.length > 0;
  return (
    <ModalShell title="Vigruzkani tahrirlash" onClose={onClose}>
      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        <Field label="Km" value={km} onChange={setKm} suffix="km" /><AddressPicker value={address} onChange={setAddress} /><Field label="Prisep motochasi" value={motoChas} onChange={setMotoChas} suffix="soat" />
        {motoChas !== "" && <PhotoPicker label="Motochas ko'rsatkichi rasmi" photo={motoChasPhoto} onPick={setMotoChasPhoto} onClear={() => setMotoChasPhoto(null)} required allowComment />}
        <MultiPhotoPicker label="Tushirish hujjati fotosi" photos={photos} onChange={setPhotos} required allowComment />
        <div style={{ fontSize: 11, color: COLORS.green }}>Saqlagach, bosib o'tilgan masofa va ishlagan soat shu yangi qiymat asosida avtomatik qayta hisoblanadi.</div>
        <Btn full disabled={!valid} onClick={() => onSave({ km: num(km), address, motoChas: num(motoChas), motoChasPhoto, photos })} icon={Check}>Saqlash</Btn>
      </div>
    </ModalShell>
  );
}
function PhotoGroupRow({ ev }) {
  return (<>
    {ev.photos && ev.photos.length > 0 && <div style={{ marginTop: 8 }}><PhotoGroup photos={ev.photos} /></div>}
    {(ev.tractorDieselPhotos?.length > 0 || ev.trailerDieselPhotos?.length > 0 || ev.adBluePhotos?.length > 0 || ev.motoChasPhoto) && (
      <div style={{ display: "flex", gap: 16, marginTop: 8, flexWrap: "wrap" }}>
        <PhotoGroup label="Tyagach cheki" photos={ev.tractorDieselPhotos} />
        <PhotoGroup label="Prisep cheki" photos={ev.trailerDieselPhotos} />
        <PhotoGroup label="AdBlue cheki" photos={ev.adBluePhotos} />
        <PhotoGroup label="Motochas rasmi" photos={ev.motoChasPhoto ? [ev.motoChasPhoto] : []} />
      </div>
    )}
  </>);
}
const FIELD_LABELS = { address: "Manzil", km: "Km", newKm: "Km", distance: "Masofa", tractorLiters: "Tyagach diesel", trailerLiters: "Prisep diesel", adBlue: "AdBlue", motoChas: "Motochas", motoChasWorked: "Ishlagan soat", loadStatus: "Yuk holati", newTractorNumber: "Yangi tyagach", newTrailerNumber: "Yangi prisep" };
const LOAD_LABELS = { S_GRUZ: "S GRUZ", BEZ_GRUZ: "BEZ GRUZ" };
function EventDetail({ label, ev, fields, standalonePanel, editable, onEdit }) {
  const rows = fields.filter((f) => ev[f] !== undefined && ev[f] !== null && ev[f] !== "");
  const showEdit = editable && onEdit && EDITABLE_TYPES.includes(ev.type);
  const content = (
    <>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
        <span style={{ fontFamily: "Oswald", fontSize: 13, fontWeight: 600, color: COLORS.amber }}>{label}</span>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}><span style={{ fontSize: 10.5, color: COLORS.muted }}>{fmtDate(ev.at)}</span>{showEdit && <button onClick={onEdit} style={{ background: "transparent", border: `1px solid ${COLORS.border}`, borderRadius: 6, padding: "3px 8px", color: COLORS.amber, fontSize: 10.5, fontFamily: "Inter", fontWeight: 600, cursor: "pointer" }}>Tahrirlash</button>}</div>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
        {rows.map((f) => <div key={f} style={{ display: "flex", justifyContent: "space-between", fontSize: 12 }}><span style={{ color: COLORS.muted }}>{FIELD_LABELS[f]}</span><span style={{ fontFamily: "'Roboto Mono', monospace", fontWeight: 600 }}>{f === "loadStatus" ? LOAD_LABELS[ev[f]] : f === "km" || f === "distance" || f === "newKm" ? `${fmt(ev[f])} km` : f === "motoChas" || f === "motoChasWorked" ? `${fmt(ev[f])} soat` : f.toLowerCase().includes("liters") || f === "adBlue" ? `${fmt(ev[f])} l` : ev[f]}</span></div>)}
      </div>
      <PhotoGroupRow ev={ev} />
    </>
  );
  return standalonePanel ? <Panel>{content}</Panel> : <div style={{ background: COLORS.panel2, borderRadius: 8, padding: 12 }}>{content}</div>;
}

// ---------------- Profil ----------------
function ProfilTab({ driver, trip, onReset }) {
  const [confirmingReset, setConfirmingReset] = useState(false);
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Panel><div style={{ fontFamily: "Oswald", fontSize: 15, fontWeight: 600, marginBottom: 12 }}>Haydovchi</div><div style={{ fontSize: 14 }}>{driver.firstName} {driver.lastName}</div></Panel>
      <Panel>
        <div style={{ fontFamily: "Oswald", fontSize: 15, fontWeight: 600, marginBottom: 12 }}>Joriy transport</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
          <Readout label="Tyagach" value={trip.tractorNumber} /><Readout label="Prisep" value={trip.trailerNumber || "PRISEPSIZ"} tone={trip.trailerNumber ? "amber" : "red"} />
          <Readout label="Joriy tyagachda bosilgan" value={fmt(trip.lastKm - trip.currentTractorStartKm)} unit="km" /><Readout label="Joriy prisepda ishlagan" value={fmt(trip.lastMotoChas - trip.currentTrailerStartMotoChas)} unit="soat" tone="amber" />
        </div>
        {trip.motoChasPhoto && <div style={{ marginTop: 14 }}><PhotoGroup label="Boshlang'ich motochas rasmi" photos={[trip.motoChasPhoto]} /></div>}
      </Panel>
      <Panel>
        <div style={{ fontFamily: "Oswald", fontSize: 13.5, fontWeight: 600, marginBottom: 8 }}>Reysni yakunlash</div>
        <div style={{ fontSize: 11.5, color: COLORS.muted, marginBottom: 10 }}>Bu amal tyagach va prisepni bazada "bo'sh" holatiga o'tkazadi va reysni yopadi.</div>
        {!confirmingReset ? <Btn variant="danger" full onClick={() => setConfirmingReset(true)}>Reysni yakunlash</Btn> : (
          <div style={{ display: "flex", gap: 10 }}><Btn variant="ghost" onClick={() => setConfirmingReset(false)}>Bekor qilish</Btn><Btn variant="danger" full onClick={onReset}>Tasdiqlayman</Btn></div>
        )}
      </Panel>
    </div>
  );
}

(window.__bootGate || Promise.resolve()).then(function () { ReactDOM.createRoot(document.getElementById("root")).render(<App />); });
</script>

// Ilovani telefonga o'rnatish imkoniyati uchun (hech narsani keshlamaydi)
if ("serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("/sw.js").catch(function () {}); });
</script>
